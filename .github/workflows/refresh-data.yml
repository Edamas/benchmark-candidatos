name: Atualizar dados do TSE

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas requests
      - run: python scripts/refresh_tse.py
      - name: Commit snapshot when changed
        run: |
          git config user.name "brasil-com-censo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tse_candidates_snapshot.csv data/finance_snapshot.csv
          git diff --cached --quiet || git commit -m "dados: atualiza snapshots do TSE"
          git push
